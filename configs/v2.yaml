# Full v2a grid: 5 contexts x 1 generator, judged by a local model.
#
# n_queries sized from configs/v2-smoke.yaml measured on this machine
# (Ryzen 7 8845HS, CPU only): generation p50 9 s (no passage) to 51 s (5 passages),
# judging p50 28 s (one call, no passage) to 130 s (two calls). That is ~190 s of
# generation and ~520 s of judging per query across the five contexts, so 40 queries
# x 5 contexts = 200 answers ~= 8 h, plus a one-off ~2.5 h to index the dense contexts.
dataset: { name: alloprof, n_queries: 40, seed: 42 }
n_passages: 5
oracle_chunker: fixed_1000_200
generator: { model: "llama3.2:latest", temperature: 0, max_tokens: 300, timeout_s: 300 }
judge:     { model: "llama3.1:8B",     temperature: 0, max_tokens: 200, timeout_s: 600 }
contexts:
  - { name: none,     kind: empty }
  - { name: bm25,     kind: retrieved, chunker: none,           retriever: bm25 }
  - { name: e5-small, kind: retrieved, chunker: none,           retriever: dense:e5-small }
  - { name: bge-m3,   kind: retrieved, chunker: fixed_1000_200, retriever: dense:bge-m3 }
  - { name: oracle,   kind: oracle }
annotation: { n: 60, seed: 7 }
